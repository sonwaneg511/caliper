<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Job</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: #ffffff;
            border-radius: 10px;
            padding: 40px 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 90%;
        }

        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1px solid #d0d5db;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f9f9f9;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #007bff;
            background-color: #fff;
            outline: none;
        }

        .mode-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .mode-options label {
            flex: 1;
            text-align: center;
            background-color: #f0f0f0;
            padding: 10px;
            margin: 0 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .mode-options input[type="radio"] {
            display: none;
        }

        .mode-options input[type="radio"]:checked + label {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            padding: 14px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Job</h2>
    <form action="/jobs" method="post" th:object="${job}">

        <label>Job Name:</label>
        <input type="text" th:field="*{jobName}" required>

        <label>Class Name:</label>
        <input type="text" th:field="*{className}" required>

        <label>Job Parameters (XML):</label>
        <textarea th:field="*{jobParams}" rows="5"
                  placeholder="Example: &lt;param&gt;&lt;days&gt;7&lt;/days&gt;&lt;/param&gt;"></textarea>

        <label>Scheduling Mode:</label>

        <div class="mode-options">
            <input type="radio" name="scheduleMode" id="mode-time" value="time" onclick="toggleMode('time')" checked>
            <label for="mode-time">At Time</label>

            <input type="radio" name="scheduleMode" id="mode-delay" value="delay" onclick="toggleMode('delay')">
            <label for="mode-delay">Delay</label>

            <input type="radio" name="scheduleMode" id="mode-onetime" value="oneTime" onclick="toggleMode('oneTime')">
            <label for="mode-onetime">One-Time</label>
        </div>

        <div id="timeGroup">
            <label>Time (HH:mm):</label>
            <input type="text" id="timeInput" name="timeInput" placeholder="14:30">
        </div>

        <div id="delayGroup" style="display: none;">
            <label>Custom Delay (Minutes):</label>
            <input type="number" id="delayInput" name="delayMinutes" min="1" th:field="*{delayMinutes}">
        </div>

        <input type="checkbox" id="oneTimeCheckbox" th:field="*{oneTime}" style="display:none;">

        <button type="submit">Save Job</button>

    </form>
</div>

<script>
    function toggleMode(mode) {
        const timeGroup = document.getElementById('timeGroup');
        const delayGroup = document.getElementById('delayGroup');
        const oneTimeCheckbox = document.getElementById('oneTimeCheckbox');

        if (mode === 'time') {
            timeGroup.style.display = 'block';
            delayGroup.style.display = 'none';
            oneTimeCheckbox.checked = false;
        } else if (mode === 'delay') {
            timeGroup.style.display = 'none';
            delayGroup.style.display = 'block';
            oneTimeCheckbox.checked = false;
        } else if (mode === 'oneTime') {
            timeGroup.style.display = 'none';
            delayGroup.style.display = 'none';
            oneTimeCheckbox.checked = true;
        }
    }

    toggleMode('time');  // Default mode
</script>

</body>
</html>
