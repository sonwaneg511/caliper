<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        h2 {
            font-weight: bold;
            color: #2d3748;
            text-align: center;
            margin-bottom: 20px;
        }

        .button-link {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 auto 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .button-link:hover {
            background-color: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 14px 10px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        button, a.action-btn {
            display: inline-block;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
            color: white;
            cursor: pointer;
        }

        .run-btn { background-color: #1e90ff; }
        .run-btn:hover { background-color: #006ad9; }

        .stop-btn { background-color: #dc3545; }
        .stop-btn:hover { background-color: #b02a37; }

        .delete-btn { background-color: #6c757d; }
        .delete-btn:hover { background-color: #545b62; }

        .view-logs-btn { background-color: #20c997; }
        .view-logs-btn:hover { background-color: #159f76; }

        .edit-btn {
            background-color: #ffc107;
            color: #212529;
        }

        .edit-btn:hover {
            background-color: #e0a800;
            color: #212529;
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            tr {
                margin-bottom: 20px;
            }

            td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }

            td::before {
                content: attr(data-label);
                position: absolute;
                left: 15px;
                top: 10px;
                font-weight: bold;
                text-align: left;
            }

            th {
                display: none;
            }
		
			.run-btn.disabled-btn {
			    background-color: #adb5bd !important;
			    cursor: not-allowed !important;
			    opacity: 0.8;
			}


        }
    </style>
</head>
<body>

<h2>Job List</h2>
<a href="/jobs/new" class="button-link">+ Add New Job</a>

<table>
    <thead>
        <tr>
            <th>Job Name</th>
            <th>Class</th>
            <th>Schedule</th>
            <th>Next Run</th>
            <th>Parameters</th>
            <th colspan="5">Actions</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="job : ${jobs}">
        <td data-label="Job Name" th:text="${job.jobName}"></td>
        <td data-label="Class" th:text="${job.className}"></td>
		<td data-label="Schedule"
		    th:text="${job.oneTime ? 'One-Time' : 
		              (job.delayMinutes != null ? 'Every (' + job.delayMinutes + ' mins)' :  'Cron (' + job.cronExpression + ')')}">
		</td>
        <td data-label="Next Run" th:text="${job.nextRun} ?: '-'"></td>
        <td data-label="Params" th:text="${job.jobParams} ?: '-'"></td>

        <td data-label="Run">
            <form th:action="@{/jobs/run/{id}(id=${job.id})}" method="post">
				<button type="submit"
				        class="run-btn"
				        th:id="'runBtn-' + ${job.id}"
				        th:attr="
				            data-job-id=${job.id},
				            data-delay=${job.delayMinutes},
				            data-cron=${job.cronExpression},
				            data-onetime=${job.oneTime}
				        ">
				    Run Now
				</button>
            </form>
        </td>

        <td data-label="Stop">
            <form th:action="@{/jobs/stop/{id}(id=${job.id})}" method="post">
				<button type="submit"
				        class="stop-btn"
				        th:id="'stopBtn-' + ${job.id}">
				    Stop
				</button>
            </form>
        </td>

        <td data-label="Edit">
            <a th:href="@{/jobs/edit/{id}(id=${job.id})}" class="action-btn edit-btn">Edit</a>
        </td>

        <td data-label="Delete">
            <form th:action="@{/jobs/delete/{id}(id=${job.id})}" method="post">
                <button type="submit" class="delete-btn"
                        onclick="return confirm('Are you sure you want to delete this job?');">
                    Delete
                </button>
            </form>
        </td>

        <td data-label="Logs">
            <a th:href="@{'/logs/' + ${job.id}}" class="action-btn view-logs-btn">View Logs</a>
        </td>
    </tr>
    </tbody>
</table>

</body>

<script>
function updateJobUI(btn, isRunning) {

    const jobId = btn.dataset.jobId;
    const runBtn = document.getElementById("runBtn-" + jobId);
    const stopBtn = document.getElementById("stopBtn-" + jobId);

    if (!runBtn || !stopBtn) return;

    const hasDelay = btn.dataset.delay && btn.dataset.delay !== "null";
    const hasCron = btn.dataset.cron && btn.dataset.cron !== "null";

    if (isRunning) {
        runBtn.disabled = true;
        runBtn.innerText = "Running...";
        runBtn.classList.add("disabled-btn");

        stopBtn.disabled = false;
        return;
    }

    if (hasDelay || hasCron) {
        runBtn.disabled = true;
        runBtn.innerText = "Scheduled";
        runBtn.classList.add("disabled-btn");

        stopBtn.disabled = true;
    } else {
        runBtn.disabled = false;
        runBtn.innerText = "Run Now";
        runBtn.classList.remove("disabled-btn");

        stopBtn.disabled = true;
    }
}

function checkJobStatus(btn) {
    const jobId = btn.dataset.jobId;

    fetch(`/jobs/status/${jobId}`)
        .then(res => res.json())
        .then(isRunning => updateJobUI(btn, isRunning));
}

function startPolling() {
    document.querySelectorAll("[data-job-id]").forEach(btn => {
        checkJobStatus(btn);
    });
}

window.onload = startPolling;
setInterval(startPolling, 3000);
</script>



</html>
