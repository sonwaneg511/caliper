<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #333333;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555555;
        }

        input[type="text"],
        input[type="time"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .info-text {
            color: gray;
            font-style: italic;
            font-size: 14px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button, .cancel-link {
            background-color: #007bff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover, .cancel-link:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .cancel-link {
            background-color: #6c757d;
        }

        .cancel-link:hover {
            background-color: #5a6268;
        }
		
		.info-text {
		    padding: 8px 12px;
		    background-color: #f1f3f5;
		    border-radius: 6px;
		    font-size: 14px;
		    color: #333;
		}


    </style>
</head>
<body>

<div class="container">
    <h2>Edit Job</h2>

    <form th:action="@{/jobs/update}" th:object="${job}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="className">Job	 Name:</label>
		<p th:text="*{jobName}" class="info-text"></p>
		<input type="hidden" th:field="*{jobName}" />

		<label for="className">Class Name:</label>
		<p th:text="*{className}" class="info-text"></p>
		<input type="hidden" th:field="*{className}" />
		
        <label for="jobParams">Parameters (XML):</label>
        <textarea th:field="*{jobParams}" rows="8"
                  placeholder="Example: &lt;param&gt;&lt;client&gt;abc&lt;/client&gt;&lt;/param&gt;"></textarea>

        <div th:if="${job.oneTime}">
            <p class="info-text">This is a one-time job. No cron schedule.</p>
            <input type="hidden" th:field="*{oneTime}" />
        </div>

		
		
        <div th:unless="${job.oneTime}">
            <label for="timeInput">Execution Time (HH:mm):</label>
            <input type="time" id="timeInput" name="timeInput" th:value="${timeInput}" />
            <input type="hidden" th:field="*{oneTime}" />
        </div>

        <div class="button-group">
            <button type="submit">Update</button>
            <a class="cancel-link" th:href="@{/jobs}">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
