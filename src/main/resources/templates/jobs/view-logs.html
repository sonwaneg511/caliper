<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Log File Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        h2 {
            font-size: 24px;
            color: #222;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 10px;
        }

        .log-viewer {
            background-color: #212529;
            color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
        }

        .back-link {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .back-link:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="'Log File: ' + ${fileName}"></h2>

    <div class="log-viewer">
        <div th:each="line : ${logLines}" th:text="${line}"></div>
    </div>

    <div class="action-buttons">
        <a class="back-link"
           th:href="@{/logs/{id}(id=${#strings.substringBefore(fileName, '_')})}">
            ← Back to Logs
        </a>
    </div>
</div>

</body>
</html>
