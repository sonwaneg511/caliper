<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Log Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f4f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .log-list {
            max-height: 400px; /* Scroll starts after this height */
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            padding: 10px;
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li {
            margin-bottom: 10px;
        }

        a.log-link {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        a.log-link:hover {
            background-color: #0056b3;
        }

        .back-button {
            align-self: center;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .back-button:hover {
            background-color: #5a6268;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Logs for Job ID: <span th:text="${jobId}"></span></h2>

    <div class="log-list">
        <ul>
            <li th:each="fileName : ${logFiles}">
                <a class="log-link"
                   th:href="@{/logs/view/{file}(file=${fileName})}"
                   th:text="${fileName}">
                </a>
            </li>
        </ul>
    </div>

    <a class="back-button" th:href="@{/jobs}">← Back to Jobs</a>
</div>

</body>
</html>
